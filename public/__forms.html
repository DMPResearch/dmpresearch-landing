<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify Forms detection</title>
  </head>
  <body>
    <!--
      Netlify scans the published site for forms. This static copy makes the
      forms discoverable even when Astro pages own the visible UI.
    -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="company" />
      <textarea name="message"></textarea>
    </form>
    <form name="investor" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="investor" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="company" />
      <textarea name="message"></textarea>
    </form>
    <form
      name="careers"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      enctype="multipart/form-data"
      hidden
    >
      <input type="hidden" name="form-name" value="careers" />
      <input type="hidden" name="subject" value="DMPResearch contract application" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="company" />
      <textarea name="message"></textarea>
      <input type="file" name="cv" />
    </form>
  </body>
</html>
