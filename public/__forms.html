<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify Forms detection</title>
  </head>
  <body>
    <!--
      Netlify scans the published site for forms. This static copy makes the
      contact form discoverable even when the Astro page posts via fetch.
    -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="company" />
      <textarea name="message"></textarea>
    </form>
    <form name="investor" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="investor" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="company" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
